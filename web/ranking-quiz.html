<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking ao vivo - SENATEDU</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            color-scheme: light;
            --ink: #102a43;
            --muted: #486581;
            --canvas: #eef5f8;
            --panel: #ffffff;
            --primary: #087e8b;
            --primary-dark: #075b66;
            --gold: #f4a261;
            --silver: #93a5b1;
            --bronze: #bb7a46;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            color: var(--ink);
            background:
                linear-gradient(135deg, rgba(8, 126, 139, .08) 25%, transparent 25%) 0 0 / 28px 28px,
                linear-gradient(315deg, rgba(244, 162, 97, .08) 25%, transparent 25%) 0 0 / 28px 28px,
                var(--canvas);
        }
        .screen { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 32px 0 48px; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
        .brand { display: flex; align-items: center; gap: 12px; color: var(--primary-dark); font: 700 16px/1 Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
        .brand i { font-size: 22px; }
        .live { display: inline-flex; align-items: center; gap: 8px; color: var(--primary-dark); font: 700 13px/1 Arial, sans-serif; text-transform: uppercase; letter-spacing: .08em; }
        .live-dot { width: 10px; height: 10px; border-radius: 50%; background: #e63946; animation: pulse 1.4s infinite; }
        .hero { padding: clamp(18px, 3vw, 30px); border: 1px solid #d8e4e8; border-radius: 8px; background: var(--panel); box-shadow: 0 12px 28px rgba(16, 42, 67, .1); text-align: center; }
        .eyebrow { margin: 0; color: var(--primary); font: 700 13px/1.3 Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
        h1 { margin: 7px auto 0; max-width: 920px; font-size: clamp(20px, 2.6vw, 34px); line-height: 1.15; }
        .status { margin: 8px 0 0; color: var(--muted); font: 600 clamp(14px, 1.5vw, 17px)/1.4 Arial, sans-serif; }
        .timer { margin: 16px auto 0; max-width: 850px; }
        .timer-label { color: var(--primary); font: 700 12px/1 Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
        .timer-value { margin-top: 5px; color: var(--primary-dark); font: 700 clamp(42px, 6vw, 70px)/.9 Arial, sans-serif; font-variant-numeric: tabular-nums; }
        .timer-bar { height: 10px; margin-top: 10px; overflow: hidden; border-radius: 999px; background: #dcebed; }
        .timer-fill { height: 100%; width: 0; background: var(--primary); transition: width .75s linear, background-color .25s; }
        .ranking { margin-top: 20px; padding: clamp(26px, 4vw, 52px); border-radius: 8px; background: #103b52; color: white; box-shadow: 0 20px 42px rgba(16, 42, 67, .2); }
        .ranking-head { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 28px; font: 700 clamp(28px, 4vw, 46px)/1 Arial, sans-serif; }
        .ranking-head i { color: #ffd166; }
        .ranking-list { display: grid; gap: 10px; }
        .rank-row { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto auto; align-items: center; gap: 22px; min-height: 82px; padding: 16px 22px; border-radius: 6px; background: rgba(255, 255, 255, .11); animation: reveal .45s both; }
        .rank-row:first-child { background: linear-gradient(90deg, rgba(244, 162, 97, .35), rgba(255, 255, 255, .12)); }
        .rank-position { font: 700 clamp(28px, 3vw, 38px)/1 Arial, sans-serif; text-align: center; color: #d6e7ed; }
        .rank-row:nth-child(1) .rank-position { color: #ffd166; }
        .rank-row:nth-child(2) .rank-position { color: #dce6ed; }
        .rank-row:nth-child(3) .rank-position { color: #f0b27a; }
        .rank-name { overflow: hidden; font-size: clamp(22px, 3vw, 34px); font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
        .rank-score { color: #8be5ed; font: 700 clamp(16px, 1.8vw, 21px)/1 Arial, sans-serif; white-space: nowrap; }
        .rank-time { color: #c9dbe2; font: 500 clamp(15px, 1.6vw, 19px)/1 Arial, sans-serif; white-space: nowrap; }
        .empty { padding: 30px; color: #c9dbe2; font: 600 17px/1.4 Arial, sans-serif; text-align: center; }
        .footer { margin-top: 18px; color: var(--muted); font: 600 13px/1.4 Arial, sans-serif; text-align: center; }
        .finished .timer-fill { background: #1c9c7a; }
        .finished .timer-label, .finished .timer-value { color: #1c6b58; }
        .error { max-width: 600px; margin: 16vh auto; padding: 32px; border-radius: 8px; background: white; box-shadow: 0 16px 40px rgba(16, 42, 67, .12); color: #9b2226; font: 600 17px/1.5 Arial, sans-serif; text-align: center; }
        @keyframes pulse { 50% { opacity: .35; transform: scale(.7); } }
        @keyframes reveal { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 620px) {
            .screen { width: min(100% - 24px, 1180px); padding-top: 18px; }
            .topbar { margin-bottom: 16px; }
            .rank-row { grid-template-columns: 42px minmax(0, 1fr) auto; gap: 10px; padding: 12px; }
            .rank-time { display: none; }
        }
    </style>
</head>
<body>
    <main class="screen" id="screen">
        <header class="topbar">
            <div class="brand"><i class="fas fa-graduation-cap"></i> SENATEDU</div>
            <div class="live"><span class="live-dot"></span> Ao vivo</div>
        </header>
        <section class="hero" aria-live="polite">
            <p class="eyebrow" id="quiz-progress">Quiz ao vivo</p>
            <h1 id="quiz-title">Carregando Quiz...</h1>
            <p class="status" id="quiz-status">Conectando à sala.</p>
            <div class="timer" id="timer-panel">
                <div class="timer-label">Tempo restante</div>
                <div class="timer-value" id="timer-value">--</div>
                <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
            </div>
        </section>
        <section class="ranking" aria-live="polite">
            <div class="ranking-head"><i class="fas fa-ranking-star"></i> Ranking atualizado</div>
            <div class="ranking-list" id="ranking-list"><p class="empty">Aguardando respostas dos alunos...</p></div>
        </section>
        <p class="footer">Atualização automática a cada poucos segundos</p>
    </main>
    <script>
        const API_URL = 'https://us-central1-educloud-sistema.cloudfunctions.net/getPublicAtividadeAvulsa';
        const params = new URLSearchParams(window.location.search);
        const schoolId = params.get('escola');
        const atividadeId = params.get('id');
        const title = document.getElementById('quiz-title');
        const progress = document.getElementById('quiz-progress');
        const status = document.getElementById('quiz-status');
        const timerPanel = document.getElementById('timer-panel');
        const timerLabel = timerPanel.querySelector('.timer-label');
        const timerValue = document.getElementById('timer-value');
        const timerFill = document.getElementById('timer-fill');
        const rankingList = document.getElementById('ranking-list');
        let activity = null;
        let renderSignature = '';

        function escapeHtml(value) {
            return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        async function fetchActivity() {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ schoolId, atividadeId })
            });
            const payload = await response.json();
            if (!response.ok || !payload?.ok || !payload.atividade) throw new Error(payload?.message || 'Não foi possível carregar o Quiz.');
            return payload.atividade;
        }

        function renderRanking(ranking) {
            const signature = JSON.stringify(ranking || []);
            if (signature === renderSignature) return;
            renderSignature = signature;
            rankingList.innerHTML = ranking?.length
                ? ranking.map((item, index) => `<div class="rank-row" style="animation-delay:${index * 55}ms"><div class="rank-position">${item.posicao || index + 1}º</div><div class="rank-name">${escapeHtml(item.alunoNome || 'Aluno')}</div><div class="rank-score">${Number(item.acertos || 0)} acerto(s)</div><div class="rank-time">${Number(item.tempoTotal || 0).toFixed(1)}s</div></div>`).join('')
                : '<p class="empty">Aguardando respostas dos alunos...</p>';
        }

        function refreshTimer() {
            if (!activity || activity.quizStatus !== 'running') return;
            const startedAt = Date.parse(activity.quizQuestionStartedAt || '');
            const questionIndex = Number(activity.quizQuestionIndex || 0);
            const timeLimit = Number(activity.questions?.[questionIndex]?.timeLimit || activity.quizTempoQuestao || 30);
            const preparationSeconds = 5;
            const elapsedSinceRelease = Number.isFinite(startedAt) ? Math.max(0, Math.floor((Date.now() - startedAt) / 1000)) : 0;
            const preparationLeft = Math.max(0, preparationSeconds - elapsedSinceRelease);
            if (preparationLeft > 0) {
                timerLabel.textContent = 'Preparação';
                timerValue.textContent = `${preparationLeft}s`;
                timerFill.style.width = `${(preparationLeft / preparationSeconds) * 100}%`;
                timerFill.style.backgroundColor = '';
                status.textContent = 'Prepare-se para a próxima questão.';
                return;
            }
            const elapsed = Math.max(0, elapsedSinceRelease - preparationSeconds);
            const secondsLeft = Math.max(0, timeLimit - elapsed);
            timerLabel.textContent = 'Tempo restante';
            timerValue.textContent = `${secondsLeft}s`;
            timerFill.style.width = `${Math.min(100, (secondsLeft / timeLimit) * 100)}%`;
            timerFill.style.backgroundColor = secondsLeft <= 5 ? '#e63946' : '';
            status.textContent = secondsLeft > 0 ? 'Envie sua resposta antes do tempo terminar.' : 'Tempo encerrado. Aguarde a próxima questão.';
        }

        function render(nextActivity) {
            activity = nextActivity;
            document.title = `${activity.titulo || 'Quiz'} - Ranking ao vivo`;
            title.textContent = activity.titulo || 'Quiz ao vivo';
            renderRanking(activity.quizRanking || []);
            document.getElementById('screen').classList.toggle('finished', activity.quizStatus === 'finished');

            if (activity.quizStatus === 'finished') {
                progress.textContent = 'Quiz finalizado';
                status.textContent = 'Parabéns a todos os participantes.';
                timerPanel.hidden = true;
                return;
            }
            timerPanel.hidden = activity.quizStatus !== 'running';
            if (activity.quizStatus !== 'running') {
                progress.textContent = 'Sala aberta';
                status.textContent = 'Aguardando o professor iniciar a próxima questão.';
                return;
            }
            progress.textContent = `Questão ${Number(activity.quizQuestionIndex || 0) + 1} de ${(activity.questions || []).length}`;
            refreshTimer();
        }

        async function update() {
            try {
                render(await fetchActivity());
            } catch (error) {
                document.getElementById('screen').innerHTML = `<div class="error"><i class="fas fa-triangle-exclamation"></i><br>${escapeHtml(error.message || 'Falha ao carregar o painel.')}</div>`;
            }
        }

        if (!schoolId || !atividadeId) {
            document.getElementById('screen').innerHTML = '<div class="error">Link do painel inválido.</div>';
        } else {
            update();
            setInterval(update, 2000);
            setInterval(refreshTimer, 1000);
        }
    </script>
</body>
</html>
