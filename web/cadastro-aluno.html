<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno — SENATEDU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

<div id="app-content" class="flex-1 flex items-center justify-center p-4">
    <div id="loading" class="text-center">
        <div class="inline-block w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-gray-500">Carregando dados da turma...</p>
    </div>
</div>

<footer class="text-center py-4 text-xs text-gray-400">
    SENATEDU — Sistema de Gestão Escolar
</footer>

<script type="module">
    const API_BASE_URL = 'https://us-central1-educloud-sistema.cloudfunctions.net';
    const API_TURMA_INFO = `${API_BASE_URL}/getPublicTurmaCadastroInfo`;
    const API_REGISTER = `${API_BASE_URL}/registerStudentPublic`;

    const appContent = document.getElementById('app-content');

    async function callJsonApi(url, payload) {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload || {})
        });

        let body = null;
        try {
            body = await response.json();
        } catch (_err) {
            body = null;
        }

        if (!response.ok || (body && body.ok === false)) {
            const msg = body && (body.message || body.error) ? (body.message || body.error) : `HTTP ${response.status}`;
            throw new Error(msg);
        }

        return body || {};
    }

    function escapeHtml(str) {
        return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function renderError(message) {
        appContent.innerHTML = `
            <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 text-center border border-gray-100">
                <div class="w-16 h-16 bg-red-100 rounded-full mx-auto flex items-center justify-center mb-4">
                    <i class="fas fa-triangle-exclamation text-2xl text-red-600"></i>
                </div>
                <h1 class="text-xl font-bold text-gray-900 mb-2">Link indisponível</h1>
                <p class="text-gray-500 text-sm">${escapeHtml(message)}</p>
            </div>`;
    }

    function renderSuccess(nome) {
        appContent.innerHTML = `
            <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 text-center border border-gray-100">
                <div class="w-16 h-16 bg-green-100 rounded-full mx-auto flex items-center justify-center mb-4">
                    <i class="fas fa-check text-2xl text-green-600"></i>
                </div>
                <h1 class="text-xl font-bold text-gray-900 mb-2">Cadastro realizado!</h1>
                <p class="text-gray-500 text-sm mb-6">Bem-vindo(a), <b>${escapeHtml(nome)}</b>! Seu cadastro foi concluído e você já está matriculado(a) na turma. Use seu email e senha para entrar.</p>
                <a href="index.html" class="inline-block w-full bg-blue-700 hover:bg-blue-800 text-white py-2.5 rounded-lg font-semibold transition shadow-lg">
                    <i class="fas fa-right-to-bracket mr-2"></i>Ir para o login
                </a>
            </div>`;
    }

    function renderForm(info, schoolId, turmaId) {
        const turmaLabel = info.sigop ? `${info.turmaNome} — SIGOP: ${info.sigop}` : info.turmaNome;
        appContent.innerHTML = `
            <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 space-y-6 border border-gray-100">
                <div class="text-center">
                    <div class="w-16 h-16 bg-gradient-to-br from-blue-700 to-blue-500 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4">
                        <i class="fas fa-user-graduate text-2xl text-white"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-900">Cadastro de Aluno</h1>
                    <p class="text-gray-500 text-sm mt-1">${escapeHtml(info.escolaNome)}</p>
                    <p class="text-blue-700 text-sm font-semibold mt-1"><i class="fas fa-chalkboard mr-1"></i>${escapeHtml(turmaLabel)}</p>
                </div>
                <div id="cadastro-error" class="hidden p-3 bg-red-100 text-red-700 rounded-lg text-sm text-center"></div>
                <form id="cadastro-form" class="space-y-4">
                    <div>
                        <label for="cadastro-nome" class="block text-sm font-medium text-gray-700 mb-1">Nome completo</label>
                        <input type="text" id="cadastro-nome" required autocomplete="name" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50" placeholder="Ex: Maria da Silva">
                    </div>
                    <div>
                        <label for="cadastro-email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="cadastro-email" required autocomplete="email" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50" placeholder="seu@email.com">
                    </div>
                    <div>
                        <label for="cadastro-senha" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                        <input type="password" id="cadastro-senha" required minlength="6" autocomplete="new-password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50" placeholder="Mínimo 6 caracteres">
                    </div>
                    <div>
                        <label for="cadastro-senha2" class="block text-sm font-medium text-gray-700 mb-1">Confirmar senha</label>
                        <input type="password" id="cadastro-senha2" required minlength="6" autocomplete="new-password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50" placeholder="Repita a senha">
                    </div>
                    <button type="submit" id="cadastro-btn" class="w-full bg-blue-700 hover:bg-blue-800 text-white py-2.5 rounded-lg font-semibold transition shadow-lg">
                        <span id="cadastro-btn-text">Cadastrar</span>
                    </button>
                </form>
                <p class="text-center text-sm text-gray-500">Já tem cadastro? <a href="index.html" class="text-blue-600 hover:underline">Entrar</a></p>
            </div>`;

        const form = document.getElementById('cadastro-form');
        const errorBox = document.getElementById('cadastro-error');
        const btn = document.getElementById('cadastro-btn');
        const btnText = document.getElementById('cadastro-btn-text');

        const showError = (msg) => {
            errorBox.textContent = msg;
            errorBox.classList.remove('hidden');
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');

            const nome = document.getElementById('cadastro-nome').value.trim();
            const email = document.getElementById('cadastro-email').value.trim();
            const senha = document.getElementById('cadastro-senha').value;
            const senha2 = document.getElementById('cadastro-senha2').value;

            if (nome.split(/\s+/).filter(Boolean).length < 2) {
                return showError('Informe seu nome completo (nome e sobrenome).');
            }
            if (senha.length < 6) {
                return showError('A senha deve ter pelo menos 6 caracteres.');
            }
            if (senha !== senha2) {
                return showError('As senhas não conferem. Digite novamente.');
            }

            btn.disabled = true;
            btnText.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Cadastrando...';
            try {
                await callJsonApi(API_REGISTER, { schoolId, turmaId, nome, email, senha });
                renderSuccess(nome);
            } catch (err) {
                showError(err.message || 'Não foi possível concluir o cadastro. Tente novamente.');
                btn.disabled = false;
                btnText.textContent = 'Cadastrar';
            }
        });
    }

    async function init() {
        const params = new URLSearchParams(window.location.search);
        const schoolId = (params.get('escola') || '').trim();
        const turmaId = (params.get('turma') || '').trim();

        if (!schoolId || !turmaId) {
            renderError('Link de cadastro inválido. Solicite um novo QR Code à sua escola.');
            return;
        }

        try {
            const info = await callJsonApi(API_TURMA_INFO, { schoolId, turmaId });
            renderForm(info, schoolId, turmaId);
        } catch (err) {
            renderError(err.message || 'Não foi possível carregar os dados da turma.');
        }
    }

    init();
</script>
</body>
</html>
